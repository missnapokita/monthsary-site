<!DOCTYPE html>
<html>
<head>
    <title>Happy 3rd Monthsary ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hearts"></div>

<div class="card">
    <h1>Happy 3rd Monthsary, Maureen 💖</h1>

    <p class="love-text">
    Thank you for being with me. I appreciate every moment with you 🥺❤️
    </p>

    <!-- SLIDESHOW -->
    <div class="slideshow">
        <img id="slide">
    </div>

    <!-- COUNTDOWN -->
    <h2 id="countdown"></h2>

    <!-- MESSAGE -->
    <textarea id="msgInput" placeholder="Leave a message 💌"></textarea>
    <button onclick="sendMessage()">Send 💖</button>

    <h3>Our Messages:</h3>
    <ul id="messages"></ul>
</div>

<audio autoplay loop>
  <source src="https://www.bensound.com/bensound-music/bensound-love.mp3">
</audio>

<script src="script.js"></script>
</body>
</html>
