<!DOCTYPE html>
<html>
<head>
    <title>Happy 3rd Monthsary ❤️</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="confetti"></canvas>

<div class="hearts" onclick="showLove()"></div>

<div class="toggle" onclick="toggleMode()">🌙</div>

<div class="card">
    <h1>Happy 3rd Monthsary, Maureen 💖</h1>

    <!-- TYPING EFFECT -->
    <p id="typing"></p>

    <div class="slider">
        <img id="slide">
    </div>

    <h2 id="countdown"></h2>

    <textarea id="msgInput" placeholder="Leave a message 💌"></textarea>
    <button onclick="saveMessage()">Send 💖</button>

    <h3>Our Messages:</h3>
    <ul id="messages"></ul>
</div>

<audio autoplay loop>
  <source src="https://github.com/missnapokita/july25/raw/refs/heads/main/SUGARCANE%20-%20Leonora%20(Lyrics)%20(1).mp3">
</audio>

<script src="script.js"></script>
</body>
</html>
